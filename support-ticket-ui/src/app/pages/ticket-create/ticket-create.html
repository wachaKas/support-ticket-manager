<h2>Create Ticket</h2>

<form (ngSubmit)="createTicket()">

  <div>
    <label>Email:</label>
    <input type="email" [(ngModel)]="ticket.customerEmail" name="email">
  </div>

  <div>
    <label>Subject:</label>
    <input type="text" [(ngModel)]="ticket.subject" name="subject">
  </div>

  <div>
    <label>Message:</label>
    <textarea [(ngModel)]="ticket.message" name="message"></textarea>
  </div>

  <div>
    <label>Priority:</label>
    <select [(ngModel)]="ticket.priority" name="priority">
      <option>Low</option>
      <option>Medium</option>
      <option>High</option>
      <option>Critical</option>
    </select>
  </div>

  <button type="submit">Create</button>

</form>
