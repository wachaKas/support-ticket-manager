<h2>Create Ticket</h2>

<form (ngSubmit)="createTicket()">

  <div>
    <label>Email:</label>
    <input type="email" [(ngModel)]="ticket.customerEmail" name="email">
  </div>

  <div>
    <label>Subject:</label>
    <input type="text" [(ngModel)]="ticket.subject" name="subject">
  </div>

  <div>
    <label>Message:</label>
    <textarea [(ngModel)]="ticket.message" name="message"></textarea>
  </div>

  <div>
    <label>Priority:</label>
<select [(ngModel)]="ticket.priority" name="priority">
  <option [ngValue]="0">Low</option>
  <option [ngValue]="1">Medium</option>
  <option [ngValue]="2">High</option>
  <option [ngValue]="3">Critical</option>
</select>
  </div>

  <button type="submit">Create</button>

</form>
